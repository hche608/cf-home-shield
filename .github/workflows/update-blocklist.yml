name: Update Cloudflare Gateway Blocklists

on:
  schedule:
    # Runs daily at 3:00 AM UTC (3:00 PM NZT)
    - cron: "0 3 * * *"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  # Points to allowlist.txt in this repo — just edit the file and push!
  ALLOWLIST_URLS: "https://raw.githubusercontent.com/hche608/cf-home-shield/main/allowlist.txt"

jobs:
  update-blocklist:
    name: Refresh CGPS Filter Lists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CGPS (upstream)
        uses: actions/checkout@v7
        with:
          repository: "mrrfv/cloudflare-gateway-pihole-scripts"
          ref: "main"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install npm dependencies
        run: npm ci

      - name: Download allowlists
        run: npm run download:allowlist
        env:
          ALLOWLIST_URLS: ${{ env.ALLOWLIST_URLS }}

      - name: Download blocklists
        run: npm run download:blocklist
        env:
          BLOCKLIST_URLS: ${{ vars.BLOCKLIST_URLS }}

      - name: Refresh Cloudflare Gateway lists and rules
        run: npm run cloudflare-refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LIST_ITEM_LIMIT: ${{ vars.CLOUDFLARE_LIST_ITEM_LIMIT }}
          BLOCK_PAGE_ENABLED: ${{ vars.BLOCK_PAGE_ENABLED }}

  keepalive:
    # Prevents GitHub from disabling the schedule after 60 days of inactivity
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
